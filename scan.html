<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Отметка посещаемости | Студент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 32px;
            padding: 30px 25px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background: white;
        }

        select:focus, input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-card {
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .result-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .result-error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .result-emoji {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .student-name {
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
        }

        .student-group {
            font-size: 16px;
            margin-bottom: 12px;
            opacity: 0.95;
        }

        .status-message {
            font-size: 17px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid rgba(255,255,255,0.3);
        }

        .time-info {
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.9;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            background: #f8fafc;
            padding: 14px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 13px;
            color: #475569;
            text-align: left;
            border-left: 4px solid #667eea;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 { font-size: 24px; }
            .student-name { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 Отметка посещаемости</h1>
    <div class="subtitle">Выберите свои ФИО из списка</div>

    <div class="form-group">
        <label>👤 Ваши ФИО</label>
        <select id="studentSelect">
            <option value="">-- Загрузка студентов --</option>
        </select>
    </div>

    <div class="form-group">
        <label>🕐 Текущее время</label>
        <input type="text" id="currentTime" readonly style="background: #f1f5f9; font-family: monospace; font-size: 15px;">
    </div>

    <button id="markBtn">📝 Отметиться</button>

    <div id="result"></div>
    
    <div class="info-box">
        📌 Правила:<br>
        • Вовремя — до 8:30<br>
        • Опоздание — после 8:30<br>
        • Отметиться можно только 1 раз в день
    </div>
    <div class="footer-note">
        ⚡ Если вас нет в списке — обратитесь к преподавателю
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    
    // Конфиг Firebase (твой)
    const firebaseConfig = {
        apiKey: "AIzaSyCuUnmOmVcDzkRPH4Y7xcmkx1If8NHwIQE",
        authDomain: "agroprombank-637a2.firebaseapp.com",
        projectId: "agroprombank-637a2",
        storageBucket: "agroprombank-637a2.firebasestorage.app",
        messagingSenderId: "16228435746",
        appId: "1:16228435746:web:d08e247e5fa9c7b418077b",
        measurementId: "G-PC20WNQK9C"
    };
    
    // Инициализация
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let students = [];
    let markedToday = false;
    
    // Текущая дата
    const todayDate = new Date().toISOString().split('T')[0];
    
    // Обновление времени
    function updateTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('currentTime').value = `${hours}:${minutes}:${seconds}`;
    }
    updateTime();
    setInterval(updateTime, 1000);
    
    // Загрузка списка студентов
    async function loadStudents() {
        const select = document.getElementById('studentSelect');
        try {
            const querySnapshot = await getDocs(collection(db, "students"));
            students = [];
            querySnapshot.forEach(doc => {
                students.push({ id: doc.id, ...doc.data() });
            });
            students.sort((a, b) => a.lastName.localeCompare(b.lastName));
            
            if (students.length === 0) {
                select.innerHTML = '<option value="">-- Нет студентов, сообщите преподавателю --</option>';
                document.getElementById('markBtn').disabled = true;
            } else {
                select.innerHTML = '<option value="">-- Выберите свои ФИО --</option>' + 
                    students.map(s => `<option value="${s.id}">${s.lastName} ${s.firstName} (${s.group || 'Группа не указана'})</option>`).join('');
                document.getElementById('markBtn').disabled = false;
            }
        } catch (error) {
            console.error("Ошибка:", error);
            select.innerHTML = '<option value="">-- Ошибка загрузки, обновите страницу --</option>';
        }
    }
    
    // Проверка, отмечался ли студент сегодня
    async function hasMarkedToday(studentId) {
        try {
            const attendanceRef = doc(db, "attendance", todayDate);
            const docSnap = await getDoc(attendanceRef);
            if (docSnap.exists()) {
                return docSnap.data()[studentId] !== undefined;
            }
            return false;
        } catch (error) {
            console.error("Ошибка проверки:", error);
            return false;
        }
    }
    
    // Отметка посещаемости
    window.markAttendance = async function() {
        const studentId = document.getElementById('studentSelect').value;
        const markBtn = document.getElementById('markBtn');
        const resultDiv = document.getElementById('result');
        
        if (!studentId) {
            alert("❌ Пожалуйста, выберите свои ФИО из списка");
            return;
        }
        
        const student = students.find(s => s.id === studentId);
        if (!student) {
            alert("Студент не найден");
            return;
        }
        
        // Блокируем кнопку
        markBtn.disabled = true;
        const originalText = markBtn.innerHTML;
        markBtn.innerHTML = '<span class="loading-spinner"></span> Отправка...';
        
        try {
            // Проверка, не отмечался ли уже
            const alreadyMarked = await hasMarkedToday(studentId);
            if (alreadyMarked) {
                resultDiv.innerHTML = `
                    <div class="result-card result-warning">
                        <div class="result-emoji">⚠️</div>
                        <div class="student-name">${student.lastName} ${student.firstName}</div>
                        <div class="student-group">${student.group || 'Группа не указана'}</div>
                        <div class="status-message">Вы уже отметили посещаемость сегодня!</div>
                        <div class="time-info">Повторная отметка невозможна</div>
                    </div>
                `;
                markBtn.innerHTML = '✓ Уже отмечено';
                return;
            }
            
            // Определяем статус по времени (опоздание после 8:30)
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const isLate = (hours > 8) || (hours === 8 && minutes > 30);
            const status = isLate ? "late" : "present";
            const statusText = isLate ? "опоздал" : "присутствует";
            
            // Сохраняем в Firebase
            const attendanceRef = doc(db, "attendance", todayDate);
            const currentDataSnapshot = await getDoc(attendanceRef);
            const currentData = currentDataSnapshot.exists() ? currentDataSnapshot.data() : {};
            currentData[studentId] = status;
            currentData[`${studentId}_time`] = new Date().toISOString();
            await setDoc(attendanceRef, currentData);
            
            // Показываем результат
            const isOnTime = status === "present";
            resultDiv.innerHTML = `
                <div class="result-card ${isOnTime ? 'result-success' : 'result-warning'}">
                    <div class="result-emoji">${isOnTime ? '🎉✅' : '⏰⚠️'}</div>
                    <div class="student-name">${student.lastName} ${student.firstName}</div>
                    <div class="student-group">${student.group || 'Группа не указана'}</div>
                    <div class="status-message">
                        ${isOnTime ? 'Поздравляем! Вы пришли вовремя!' : 'К сожалению, вы опоздали!'}
                    </div>
                    <div class="time-info">
                        ⌚ Время отметки: ${new Date().toLocaleTimeString('ru-RU')}<br>
                        📌 Статус: ${statusText}<br>
                        ${isOnTime ? '⭐ Так держать!' : '🔔 В следующий раз приходите раньше!'}
                    </div>
                </div>
            `;
            
            // Блокируем выбор
            document.getElementById('studentSelect').disabled = true;
            markBtn.innerHTML = '✓ Отмечено успешно';
            
        } catch (error) {
            console.error("Ошибка при отметке:", error);
            resultDiv.innerHTML = `
                <div class="result-card result-error">
                    <div class="result-emoji">❌</div>
                    <div class="status-message">Ошибка при отметке</div>
                    <div class="time-info">Попробуйте позже или обратитесь к преподавателю</div>
                </div>
            `;
            markBtn.disabled = false;
            markBtn.innerHTML = originalText;
        }
    };
    
    // Загрузка студентов при старте
    loadStudents();
</script>

</body>
</html>
