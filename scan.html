<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Отметка посещаемости | Студент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px 20px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .content {
            padding: 25px 20px;
        }

        .info-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .date-badge {
            background: #3b82f6;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        .time-display {
            font-size: 2rem;
            font-weight: bold;
            color: #1e293b;
            font-family: monospace;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1e293b;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .mark-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .mark-btn:active {
            transform: scale(0.97);
        }

        .mark-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .message.warning {
            background: #fed7aa;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .already-marked {
            background: #fef3c7;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .already-marked-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Отметка</h1>
            <p>Выберите себя в списке и подтвердите присутствие</p>
        </div>
        <div class="content">
            <div class="info-card">
                <span class="date-badge" id="currentDate">--</span>
                <div class="time-display" id="currentTime">--:--:--</div>
            </div>

            <div class="form-group">
                <label>👤 Выберите свой ФИО</label>
                <select id="studentSelect">
                    <option value="">-- Загрузка списка --</option>
                </select>
            </div>

            <button class="mark-btn" id="markBtn" onclick="markAttendance()">
                ✅ Отметиться
            </button>

            <div id="messageArea"></div>
        </div>
        <div class="footer">
            Одна отметка в день | Система учета посещаемости
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // Конфигурация Firebase (такая же, как в панели)
        const firebaseConfig = {
            apiKey: "AIzaSyCuUnmOmVcDzkRPH4Y7xcmkx1If8NHwIQE",
            authDomain: "agroprombank-637a2.firebaseapp.com",
            projectId: "agroprombank-637a2",
            storageBucket: "agroprombank-637a2.firebasestorage.app",
            messagingSenderId: "16228435746",
            appId: "1:16228435746:web:d08e247e5fa9c7b418077b",
            measurementId: "G-PC20WNQK9C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Глобальные переменные
        let students = [];
        let todayDate = new Date();
        
        // Форматирование даты для Firebase (YYYY-MM-DD)
        function formatDateForFirebase(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Форматирование для отображения (DD.MM.YYYY)
        function formatDateForDisplay(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        // Обновление времени на странице
        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentDate').innerHTML = `📅 ${formatDateForDisplay(now)}`;
            document.getElementById('currentTime').innerHTML = now.toLocaleTimeString('ru-RU');
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Отображение сообщения
        function showMessage(text, type = 'info') {
            const msgDiv = document.getElementById('messageArea');
            msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                if (msgDiv.firstChild === msgDiv.lastChild) {
                    msgDiv.innerHTML = '';
                }
            }, 5000);
        }

        // Загрузка списка студентов из Firestore
        async function loadStudents() {
            try {
                const querySnapshot = await getDocs(collection(db, "students"));
                students = [];
                querySnapshot.forEach(docSnap => {
                    students.push({ id: docSnap.id, ...docSnap.data() });
                });
                students.sort((a, b) => a.lastName.localeCompare(b.lastName));
                
                const select = document.getElementById('studentSelect');
                if (students.length === 0) {
                    select.innerHTML = '<option value="">-- Нет загруженных студентов --</option>';
                    showMessage('Список студентов пуст. Обратитесь к преподавателю.', 'error');
                    document.getElementById('markBtn').disabled = true;
                } else {
                    select.innerHTML = '<option value="">-- Выберите свое ФИО --</option>' + 
                        students.map(s => `<option value="${s.id}">${s.lastName} ${s.firstName} (${s.group || 'группа'})</option>`).join('');
                    select.disabled = false;
                }
            } catch (error) {
                console.error("Ошибка загрузки студентов:", error);
                document.getElementById('studentSelect').innerHTML = '<option value="">-- Ошибка загрузки --</option>';
                showMessage('Не удалось загрузить список студентов. Проверьте соединение.', 'error');
            }
        }

        // Проверка, отмечался ли студент сегодня
        async function hasMarkedToday(studentId) {
            try {
                const dateStr = formatDateForFirebase(todayDate);
                const attendanceDoc = await getDoc(doc(db, "attendance", dateStr));
                if (attendanceDoc.exists()) {
                    const data = attendanceDoc.data();
                    return data[studentId] !== undefined && (data[studentId] === 'present' || data[studentId] === 'late');
                }
                return false;
            } catch (error) {
                console.error("Ошибка проверки отметки:", error);
                return false;
            }
        }

        // Отметка студента
        async function markAttendance() {
            const select = document.getElementById('studentSelect');
            const studentId = select.value;
            const markBtn = document.getElementById('markBtn');

            if (!studentId) {
                showMessage('Пожалуйста, выберите свое ФИО из списка', 'warning');
                return;
            }

            const selectedStudent = students.find(s => s.id === studentId);
            if (!selectedStudent) {
                showMessage('Ошибка: студент не найден', 'error');
                return;
            }

            // Блокируем кнопку на время операции
            markBtn.disabled = true;
            const originalText = markBtn.innerHTML;
            markBtn.innerHTML = '<span class="loading-spinner"></span> Проверка...';

            try {
                // Проверяем, не отмечался ли уже сегодня
                const alreadyMarked = await hasMarkedToday(studentId);
                
                if (alreadyMarked) {
                    showMessage(`❌ ${selectedStudent.lastName} ${selectedStudent.firstName}, вы уже отмечались сегодня!`, 'error');
                    markBtn.disabled = false;
                    markBtn.innerHTML = originalText;
                    return;
                }

                // Меняем текст на "Отправка..."
                markBtn.innerHTML = '<span class="loading-spinner"></span> Отправка...';

                // Определяем статус: если время опоздания (например, после 9:00)
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                let status = 'present';
                
                // Опоздание: если время позже 9:00 (можно настроить)
                if (hours > 9 || (hours === 9 && minutes > 0)) {
                    status = 'late';
                }

                const dateStr = formatDateForFirebase(todayDate);
                const attendanceRef = doc(db, "attendance", dateStr);
                
                // Получаем текущие данные за день
                const existingDoc = await getDoc(attendanceRef);
                let currentData = existingDoc.exists() ? existingDoc.data() : {};
                
                // Добавляем отметку студента
                currentData[studentId] = status;
                
                // Сохраняем обратно
                await setDoc(attendanceRef, currentData);
                
                // Успех!
                showMessage(`✅ ${selectedStudent.lastName} ${selectedStudent.firstName}, вы успешно отметили ${status === 'present' ? 'присутствие' : 'присутствие (с опозданием)'}!`, 'success');
                
                // Блокируем кнопку навсегда для этого студента в этот день
                markBtn.disabled = true;
                markBtn.innerHTML = '✅ Отмечено!';
                document.getElementById('studentSelect').disabled = true;
                
                // Показываем, что уже отметился
                const container = document.querySelector('.content');
                const alreadyDiv = document.createElement('div');
                alreadyDiv.className = 'already-marked';
                alreadyDiv.innerHTML = `
                    <div class="already-marked-icon">✅</div>
                    <strong>Вы уже отметились сегодня</strong><br>
                    <small>${status === 'present' ? 'Присутствие подтверждено' : 'Отмечено с опозданием'}</small>
                `;
                const existingAlert = document.querySelector('.already-marked');
                if (existingAlert) existingAlert.remove();
                container.insertBefore(alreadyDiv, document.getElementById('messageArea'));
                
            } catch (error) {
                console.error("Ошибка при отметке:", error);
                showMessage('Произошла ошибка при отметке. Попробуйте позже.', 'error');
                markBtn.disabled = false;
                markBtn.innerHTML = originalText;
            }
        }

        // Делаем функцию глобальной для HTML onclick
        window.markAttendance = markAttendance;

        // Инициализация
        async function init() {
            await loadStudents();
            
            // Если студент уже отметился сегодня - блокируем кнопку и показываем информацию
            const select = document.getElementById('studentSelect');
            if (select && students.length > 0) {
                select.addEventListener('change', async (e) => {
                    const id = e.target.value;
                    if (!id) return;
                    
                    const marked = await hasMarkedToday(id);
                    const markBtn = document.getElementById('markBtn');
                    const container = document.querySelector('.content');
                    
                    if (marked) {
                        const student = students.find(s => s.id === id);
                        markBtn.disabled = true;
                        markBtn.innerHTML = '✅ Уже отмечено';
                        
                        // Удаляем старый алерт
                        const oldAlert = document.querySelector('.already-marked');
                        if (oldAlert) oldAlert.remove();
                        
                        // Добавляем новый
                        const alreadyDiv = document.createElement('div');
                        alreadyDiv.className = 'already-marked';
                        alreadyDiv.innerHTML = `
                            <div class="already-marked-icon">⚠️</div>
                            <strong>${student?.lastName} ${student?.firstName}</strong><br>
                            <small>Вы уже отмечались сегодня!</small>
                        `;
                        container.insertBefore(alreadyDiv, document.getElementById('messageArea'));
                    } else {
                        markBtn.disabled = false;
                        markBtn.innerHTML = '✅ Отметиться';
                        
                        const oldAlert = document.querySelector('.already-marked');
                        if (oldAlert) oldAlert.remove();
                    }
                });
            }
        }

        init();
    </script>
</body>
</html>
