<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Посещаемость</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.box {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

.switch {
    text-align: center;
    margin-top: 10px;
    cursor: pointer;
    color: #38bdf8;
}
</style>
</head>

<body>

<div class="box">
    <h2 id="title">Вход</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль">

    <button onclick="login()">Войти</button>

    <div class="switch" onclick="toggle()">Нет аккаунта? Регистрация</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuUnmOmVcDzkRPH4Y7xcmkx1If8NHwIQE",
  authDomain: "agroprombank-637a2.firebaseapp.com",
  projectId: "agroprombank-637a2",
  storageBucket: "agroprombank-637a2.firebasestorage.app",
  messagingSenderId: "16228435746",
  appId: "1:16228435746:web:d08e247e5fa9c7b418077b",
  measurementId: "G-PC20WNQK9C"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isLogin = true;

window.toggle = function() {
    isLogin = !isLogin;
    document.getElementById("title").innerText = isLogin ? "Вход" : "Регистрация";
    document.querySelector("button").innerText = isLogin ? "Войти" : "Создать аккаунт";
    document.querySelector(".switch").innerText = isLogin 
        ? "Нет аккаунта? Регистрация" 
        : "Уже есть аккаунт? Вход";
}

window.login = async function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        if (isLogin) {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Успешный вход ✅");
        } else {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Аккаунт создан 🎉");
        }
    } catch (e) {
        alert("Ошибка: " + e.message);
    }
}
</script>

</body>
</html>
