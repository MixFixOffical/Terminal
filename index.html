<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Система учета посещаемости</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0f172a);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.box {
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 16px;
    width: 340px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

h1 {
    text-align: center;
    font-size: 14px;
    color: #38bdf8;
    margin-bottom: 5px;
}

h2 {
    text-align: center;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    outline: none;
    background: #0f172a;
    color: white;
    border: 1px solid #334155;
}

input:focus {
    border: 1px solid #38bdf8;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.03);
}

.switch {
    text-align: center;
    margin-top: 12px;
    cursor: pointer;
    color: #38bdf8;
    font-size: 13px;
}

.loader {
    display: none;
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
}

/* 🔥 вывод ошибок внутри интерфейса */
.message {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    min-height: 18px;
}

.error {
    color: #ef4444;
}

.success {
    color: #22c55e;
}
</style>
</head>

<body>

<div class="box">

    <h1>СИСТЕМА УЧЕТА ПОСЕЩАЕМОСТИ</h1>
    <h2 id="title">Вход</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль">

    <button id="btn" onclick="authAction()">Войти</button>

    <div class="loader" id="loader">Проверка данных...</div>

    <div class="message" id="message"></div>

    <div class="switch" onclick="toggleMode()" id="switchText">
        Нет аккаунта? Регистрация
    </div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuUnmOmVcDzkRPH4Y7xcmkx1If8NHwIQE",
  authDomain: "agroprombank-637a2.firebaseapp.com",
  projectId: "agroprombank-637a2",
  storageBucket: "agroprombank-637a2.firebasestorage.app",
  messagingSenderId: "16228435746",
  appId: "1:16228435746:web:d08e247e5fa9c7b418077b",
  measurementId: "G-PC20WNQK9C"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isLogin = true;

function showMessage(text, type) {
    const msg = document.getElementById("message");
    msg.innerText = text;
    msg.className = "message " + type;
}

function showLoader(show) {
    document.getElementById("loader").style.display = show ? "block" : "none";
}

window.toggleMode = function() {
    isLogin = !isLogin;

    document.getElementById("title").innerText = isLogin ? "Вход" : "Регистрация";
    document.getElementById("btn").innerText = isLogin ? "Войти" : "Создать аккаунт";
    document.getElementById("switchText").innerText = isLogin
        ? "Нет аккаунта? Регистрация"
        : "Уже есть аккаунт? Вход";

    showMessage("", "");
}

window.authAction = async function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("Заполните все поля", "error");
        return;
    }

    showLoader(true);
    showMessage("", "");

    try {
        if (isLogin) {
            await signInWithEmailAndPassword(auth, email, password);

            showLoader(false);
            showMessage("Вход выполнен", "success");

            setTimeout(() => {
                window.location.href = "panel.html";
            }, 800);

        } else {
            await createUserWithEmailAndPassword(auth, email, password);

            showLoader(false);
            showMessage("Аккаунт создан", "success");
        }
    } catch (e) {
        showLoader(false);
        showMessage(e.message, "error");
    }
}
</script>

</body>
</html>
